name: Test

on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - ".github/workflows/test.yaml"
      - ".golangci.yaml"
      - "!benchmarks/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run lint check
        uses: reviewdog/action-golangci-lint@v2
        with:
          reporter: github-pr-review
          go_version_file: go.mod

  test:
    strategy:
      matrix:
        # the minimum version in go.mod, and the latest release
        go-version: ["1.23", stable]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      # gotestsum runs go test with the args after --, and also writes the results as JUnit XML for Codecov.
      # v1.12.3 is the latest version that builds with Go 1.23 (v1.13.0 needs Go 1.24).
      - name: Run tests
        run: go run gotest.tools/gotestsum@v1.12.3 --junitfile junit.xml -- -tags='!fuzz' -race -failfast -coverpkg=./... -coverprofile="coverage.txt" -covermode=atomic ./...

      - name: Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # runs after failed tests too, so Codecov sees the failures
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          flags: ${{ matrix.os }}-go${{ matrix.go-version }}
